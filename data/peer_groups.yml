groups:
- group_key: communications-software
  name: CPaaS and customer messaging - LINK Mobility
  description: Reviewed peer set for LINK Mobility. Focus is listed CPaaS, mobile messaging, and adjacent customer engagement software.
  status: reviewed
  curator_note: LINK has no close Oslo-listed peer. Gross margin, organic growth, message volumes, regional mix, customer concentration, leverage, and operator pass-through costs are needed for useful context.
  source: manual research 2026-04-27
  items:
  - symbol: LINK.OL
    role: focus company
    market: Oslo
    note: 'Focus company: CPaaS, mobile messaging, and digital customer engagement, with strong European SMS footprint.'
  - symbol: BRZE
    role: international peer
    market: US
    note: Customer engagement platform with messaging channels; adjacent software peer, not telecom aggregator.
  - symbol: CMCOM.AS
    role: European peer
    market: Netherlands
    note: European CPaaS and conversational commerce/customer engagement peer.
  - symbol: KVYO
    role: international peer
    market: US
    note: Marketing automation and messaging/email platform; adjacent customer engagement peer.
  - symbol: ROUTE.NS
    role: international peer
    market: India
    note: CPaaS/mobile messaging peer with emerging-market exposure; listing and ownership context differ.
  - symbol: SINCH.ST
    role: Nordic peer
    market: Sweden
    note: Closest listed Nordic CPaaS/cloud communications peer; larger and broader than LINK.
  - symbol: TWLO
    role: international peer
    market: US
    note: Global cloud communications/API platform peer; much larger and more software/API-heavy.
- group_key: defence-aerospace-europe
  name: Defence, aerospace and maritime technology - Kongsberg
  description: Reviewed peer set for Kongsberg Gruppen. Focus is European defence/aerospace primes, defence electronics, sensors, missiles, maritime technology, and relevant Nordic defence specialists.
  status: reviewed
  curator_note: Kongsberg is a mixed defence, aerospace, discovery, and maritime technology group. The proposed maritime demerger means historical comparisons should be treated carefully.
  source: manual research 2026-04-27
  items:
  - symbol: KOG.OL
    role: focus company
    market: Oslo
    note: 'Focus company: defence, aerospace, discovery, space, sensors, missiles, and maritime technology exposure.'
  - symbol: AIR.PA
    role: European peer
    market: Europe
    note: Airbus Defence and Space exposure is relevant, but Airbus is dominated by commercial aerospace.
  - symbol: BA.L
    role: European peer
    market: UK
    note: Large defence/aerospace prime; useful global defence benchmark but much larger scale.
  - symbol: HAG.DE
    role: European peer
    market: Germany
    note: Defence sensor/electronics specialist; useful for Kongsberg's sensor and surveillance exposure.
  - symbol: HO.PA
    role: European peer
    market: France
    note: Defence, aerospace, cyber, digital identity, and secure communications peer; broader than Kongsberg.
  - symbol: IVSO.ST
    role: Nordic peer
    market: Sweden
    note: Tactical communication/hearing protection specialist; niche defence electronics peer.
  - symbol: KIT.OL
    role: Oslo peer
    market: Oslo
    note: Electronics manufacturing/services supplier with defence/aerospace exposure. Oslo industrial proxy, not a defence prime.
  - symbol: LDO.MI
    role: European peer
    market: Italy
    note: Aerospace, defence, helicopters, electronics, cyber, and space peer; broader segment mix.
  - symbol: MILDEF.ST
    role: Nordic peer
    market: Sweden
    note: Defence IT and rugged hardware specialist; smaller and narrower than Kongsberg.
  - symbol: RHM.DE
    role: European peer
    market: Germany
    note: European defence systems peer, especially land systems and ammunition; product mix differs.
  - symbol: SAAB-B.ST
    role: Nordic peer
    market: Sweden
    note: Closest Nordic defence/aerospace prime by business profile.
- group_key: offshore-drilling-rigs
  name: Offshore drilling rigs - Odfjell Drilling
  description: Reviewed peer set for Odfjell Drilling. Focus is offshore drilling contractors, with notes separating harsh-environment floaters from jack-up and broader deepwater peers.
  status: reviewed
  curator_note: Rig type, harsh-environment capability, contract backlog, day rates, utilisation, leverage, and fleet ownership/management model are critical. Jack-up peers are included as Oslo context but are not direct harsh-environment floater peers.
  source: manual research 2026-04-27
  items:
  - symbol: ODL.OL
    role: focus company
    market: Oslo
    note: 'Focus company: harsh-environment semi-submersible drilling units and drilling services.'
  - symbol: BORR.OL
    role: Oslo peer
    market: Oslo
    note: Jack-up drilling contractor. Useful Oslo drilling context but shallow-water jack-ups differ from Odfjell's harsh-environment floaters.
  - symbol: NE
    role: international peer
    market: US
    note: Global offshore drilling contractor; useful international rig-cycle peer.
  - symbol: NOL.OL
    role: Oslo peer
    market: Oslo
    note: Harsh-environment semi-submersible exposure; closer rig-type context where data is available.
  - symbol: RIG
    role: international peer
    market: US
    note: Large offshore drilling contractor with ultra-deepwater and harsh-environment exposure.
  - symbol: SDRL.OL
    role: Oslo peer
    market: Oslo
    note: Deepwater drilling contractor with floater exposure; broader global fleet.
  - symbol: SHLF.OL
    role: Oslo peer
    market: Oslo
    note: Jack-up drilling contractor. Include for Oslo-listed drilling context, not direct floater comparability.
  - symbol: VAL
    role: international peer
    market: US
    note: Global offshore driller with floaters and jack-ups; broader fleet than Odfjell.
- group_key: offshore-energy-services
  name: Subsea and offshore services - DOF
  description: Reviewed peer set for DOF Group. Focus is subsea services, offshore support vessels, IMR/light construction, and adjacent offshore engineering/services.
  status: reviewed
  curator_note: DOF should not be benchmarked directly against drilling-rig owners. Backlog, vessel mix, utilisation, day rates, leverage, and project risk are required for useful sector context.
  source: manual research 2026-04-27
  items:
  - symbol: DOFG.OL
    role: focus company
    market: Oslo
    note: 'Focus company: integrated subsea services, offshore operations, marine services, OSVs, and subsea assets.'
  - symbol: AKSO.OL
    role: Oslo peer
    market: Oslo
    note: Offshore engineering/products/services peer. Useful adjacent context, not a direct vessel/subsea fleet peer.
  - symbol: FTI
    role: international peer
    market: US/Europe
    note: TechnipFMC provides subsea systems and services; adjacent global subsea peer with different equipment/EPCI mix.
  - symbol: HLX
    role: international peer
    market: US
    note: Offshore energy services and well intervention; adjacent subsea/offshore service exposure.
  - symbol: OII
    role: international peer
    market: US
    note: ROV, subsea services, and offshore engineered services; useful subsea services comparator.
  - symbol: SOFF.OL
    role: Oslo peer
    market: Oslo
    note: Offshore support vessel owner/operator; close OSV fleet context but different service integration.
  - symbol: SUBC.OL
    role: Oslo peer
    market: Oslo
    note: Subsea engineering, construction, and offshore project services. Larger and more EPCI/project-oriented than DOF.
  - symbol: TDW
    role: international peer
    market: US
    note: Large OSV peer; useful international offshore vessel context.
