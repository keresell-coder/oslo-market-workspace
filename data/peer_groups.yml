  - symbol: NOD.OL
    role: focus company
    market: Oslo
    note: 'Focus company: fabless low-power wireless connectivity chips and platforms for IoT.'
  - symbol: IFX.DE
    role: European peer
    market: Germany
    note: European semiconductor peer with IoT, power, automotive, and security exposure; much broader product mix.
  - symbol: NXPI
    role: European peer
    market: Netherlands/US
    note: Embedded processing, connectivity, and automotive/industrial exposure; scale and segment mix differ.
  - symbol: 'ON'
    role: international peer
    market: US
