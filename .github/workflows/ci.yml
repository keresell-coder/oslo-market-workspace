name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Compile server
        run: python3 -m py_compile app/server.py app/market_health.py scripts/build_static_site_data.py scripts/source_trust.py

      - name: Install test dependencies
        run: python3 -m pip install -r requirements.txt pytest

      - name: Test source trust and publication gates
        run: |
          python3 -m pytest -q
          node --test tests/*.test.cjs

      - name: Check frontend syntax
        run: |
          node --check app/static/app.js
          node --check docs/app.js
